<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>توابع مثلثاتی | MathTools</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<header>

<h1>📐 توابع مثلثاتی</h1>

<p>
محاسبه sin، cos، tan و cot
</p>

</header>


<main class="calculator">


<form method="POST">


<label>
انتخاب تابع
</label>


<select name="function">

<option value="sin">sin</option>
<option value="cos">cos</option>
<option value="tan">tan</option>
<option value="cot">cot</option>

</select>



<label>
زاویه
</label>


<input
type="text"
name="angle"
dir="ltr"
inputmode="text"
placeholder="مثلاً 30 یا π/6"
required
>



<label>
واحد زاویه
</label>


<select name="unit">

<option value="degree">
درجه °
</option>

<option value="radian">
رادیان
</option>

</select>



<button type="submit">
محاسبه
</button>


</form>



{% if result %}

<section class="result">

<h2>نتیجه</h2>

<p>
{{ result | safe }}
</p>

</section>

{% endif %}



<a href="/" class="back">
← بازگشت
</a>


</main>


</body>

</html>

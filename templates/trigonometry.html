<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>توابع مثلثاتی | MathTools</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>📐 توابع مثلثاتی</h1>
        <p>محاسبه مقدار توابع مثلثاتی</p>
    </header>

    <main class="calculator">

        <form method="POST">

            <label for="function">
                تابع مثلثاتی
            </label>

            <select name="function" id="function" required>
                <option value="sin">sin</option>
                <option value="cos">cos</option>
                <option value="tan">tan</option>
                <option value="cot">cot</option>
            </select>

            <label for="angle">
                زاویه
            </label>

            <input
                type="number"
                step="any"
                name="angle"
                id="angle"
                placeholder="مثلاً 30"
                required
            >

            <label for="unit">
                واحد زاویه
            </label>

            <select name="unit" id="unit" required>
                <option value="degree">درجه</option>
                <option value="radian">رادیان</option>
            </select>

            <button type="submit">
                🧮 محاسبه
            </button>

        </form>


        {% if result %}

        <section class="result-card">

            <h2>نتیجه</h2>

            <div class="result-row">
                <span>تابع</span>
                <strong>{{ function }}</strong>
            </div>

            <div class="result-row">
                <span>زاویه</span>
                <strong>{{ angle }} {{ unit }}</strong>
            </div>

            <div class="result-message">
                {{ result }}
            </div>

        </section>

        {% endif %}


        <a href="/" class="back">
            ← بازگشت به صفحه اصلی
        </a>

    </main>

</body>

  </html>
